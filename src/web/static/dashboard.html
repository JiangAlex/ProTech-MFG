<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>ProTech-MFG — 監控面板</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header>
    <h1>📊 監控面板</h1>
    <nav>
      <a href="/">積木編輯</a>
      <a href="/dashboard">監控面板</a>
      <a href="/editor">檔案編輯</a>
      <a href="/console">即時 Console</a>
    </nav>
  </header>
  <main style="flex-direction: column; padding: 1rem; gap: 1rem;">
    <section>
      <h2>治具接線 / Testbed
        <label style="font-size:0.85rem; margin-left:0.5rem;">型號:
          <select id="tb-model" onchange="loadTestbed()"></select>
        </label>
        <button onclick="loadTestbed()" style="font-size:0.8rem;padding:0.2rem 0.5rem;cursor:pointer;">🔄 重新整理</button>
      </h2>
      <div id="testbed-wiring">載入中...</div>
    </section>
    <section>
      <h2>執行歷史 <button onclick="reloadHistory()" style="font-size:0.8rem;padding:0.2rem 0.5rem;cursor:pointer;">🔄 重新整理</button></h2>
      <div id="run-history" hx-get="/api/runs/html" hx-trigger="load, every 10s" hx-swap="innerHTML">
        載入中...
      </div>
    </section>
  </main>

  <script>
    // --- Testbed wiring (read-only "how this bench is wired") ---
    // Model dropdown source = /api/profiles (same as the editor home page);
    // selecting a model loads config/test_node/<model>_testbed.yaml via
    // /api/testbed/<model> and renders console / power / tftp / pc.ports.
    async function loadModels() {
      try {
        var resp = await fetch('/api/profiles');
        var list = await resp.json();
        var sel = document.getElementById('tb-model');
        sel.innerHTML = '';
        list.forEach(function(p) {
          var opt = document.createElement('option');
          opt.value = p.name; opt.textContent = p.name;
          sel.appendChild(opt);
        });
        if (list.length) loadTestbed();
      } catch (e) {
        document.getElementById('testbed-wiring').textContent = '(無法載入型號清單)';
      }
    }

    function kvTable(title, obj) {
      if (!obj || Object.keys(obj).length === 0) return '';
      var rows = Object.keys(obj).map(function(k) {
        var v = obj[k];
        if (v && typeof v === 'object') v = JSON.stringify(v);
        return '<tr><td style="padding:2px 8px;color:#9fb3c8;white-space:nowrap;">' + k +
               '</td><td style="padding:2px 8px;font-family:monospace;">' + (v === '' || v == null ? '—' : v) + '</td></tr>';
      }).join('');
      return '<div style="margin:0.3rem 0;">' +
             '<div style="font-weight:bold;color:#64b5f6;">' + title + '</div>' +
             '<table style="border-collapse:collapse;">' + rows + '</table></div>';
    }

    async function loadTestbed() {
      var model = document.getElementById('tb-model').value;
      var box = document.getElementById('testbed-wiring');
      if (!model) { box.textContent = '(未選型號)'; return; }
      box.textContent = '載入中...';
      try {
        var resp = await fetch('/api/testbed/' + encodeURIComponent(model));
        if (!resp.ok) { box.textContent = '(無 ' + model + ' 的 testbed 設定)'; return; }
        var d = await resp.json();
        var html = '';
        html += kvTable('🖥️ Console', d.console);
        html += kvTable('🔌 Power (FT232H relay)', d.power);
        html += kvTable('📡 TFTP', d.tftp);
        html += kvTable('🔑 SSH', d.ssh);
        // PC ports (nested: each port has ip / connect_to).
        if (d.pc && d.pc.ports && Object.keys(d.pc.ports).length) {
          var prows = Object.keys(d.pc.ports).map(function(p) {
            var pv = d.pc.ports[p] || {};
            return '<tr><td style="padding:2px 8px;color:#9fb3c8;">' + p +
                   '</td><td style="padding:2px 8px;font-family:monospace;">' + (pv.ip || '—') +
                   '</td><td style="padding:2px 8px;font-family:monospace;">' + (pv.connect_to || '—') + '</td></tr>';
          }).join('');
          html += '<div style="margin:0.3rem 0;"><div style="font-weight:bold;color:#64b5f6;">🧩 PC Ports ' +
                  (d.pc.label ? '(' + d.pc.label + ')' : '') + '</div>' +
                  '<table style="border-collapse:collapse;"><tr><th style="padding:2px 8px;text-align:left;">port</th>' +
                  '<th style="padding:2px 8px;text-align:left;">ip</th><th style="padding:2px 8px;text-align:left;">connect_to</th></tr>' +
                  prows + '</table></div>';
        }
        box.innerHTML = html || '(此 testbed 無接線資訊)';
      } catch (e) {
        box.textContent = '(讀取失敗)';
      }
    }

    loadModels();

    // Toggle a run's log row and lazily fetch its output.
    async function toggleLog(runId) {
      var row = document.getElementById('log-' + runId);
      if (!row) return;
      if (row.style.display === 'none') {
        row.style.display = '';
        var pre = row.querySelector('pre');
        if (pre && !pre.dataset.loaded) {
          try {
            var r = await fetch('/api/runs/' + runId);
            var d = await r.json();
            pre.textContent = d.log || '(無輸出)';
            pre.dataset.loaded = '1';
          } catch (e) {
            pre.textContent = '(讀取失敗)';
          }
        }
      } else {
        row.style.display = 'none';
      }
    }

    // Stop a running test.
    async function stopRun(runId) {
      if (!confirm('確定停止此執行？')) return;
      await fetch('/api/runs/' + runId + '/stop', { method: 'POST' });
      reloadHistory();
    }

    function reloadHistory() {
      htmx.ajax('GET', '/api/runs/html', { target: '#run-history', swap: 'innerHTML' });
    }
  </script>
</body>
</html>
